# Render Blueprint — Fintellix Fraud Detection API
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: fintellix-fraud-api
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn api:app --workers 2 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: PORT
        value: "10000"
    healthCheckPath: /health
    autoDeploy: true
